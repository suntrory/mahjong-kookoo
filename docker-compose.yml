services:
  mahjong-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: mahjong-kookoo:2.0.0
    container_name: mahjong-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8090}:8080"
    environment:
      TZ: Asia/Bangkok
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/healthz']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
